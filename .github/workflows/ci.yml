name: DiAn CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*-linux-py312.txt
      - run: |
          python -m pip install -r requirements-ci-linux-py312.txt
          python -m pip check
      - name: Backend tests
        run: python -m pytest -q tests
      - name: Real Redis stale write regression
        run: |
          docker pull redis:7-alpine
          python -m evaluation.compare_stale_chat_write --output "${{ runner.temp }}/stale-chat-write.json"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: stale-chat-write
          path: ${{ runner.temp }}/stale-chat-write.json
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
