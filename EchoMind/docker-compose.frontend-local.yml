# Add to docker-compose.yml and docker-compose.local-check.yml after npm run build.
services:
  frontend:
    image: nginx:alpine
    container_name: echomind-web
    ports:
      - "127.0.0.1:5174:80"
    volumes:
      - ../EchoMindFrontend/dist:/usr/share/nginx/html:ro
      - ../EchoMindFrontend/docker/nginx.python-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      echomind:
        condition: service_healthy
    networks:
      - echomind-network
    restart: unless-stopped
