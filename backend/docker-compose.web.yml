# 在现有 Python 数据环境上启动 Web 前端和 Java 后端。
# docker compose -f docker-compose.yml -f docker-compose.web.yml up -d --build
services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: dian-web
    environment:
      PYTHON_API_URL: /api/python
      JAVA_API_URL: /api/java
    ports:
      - "127.0.0.1:5174:80"
    volumes:
      - ./config/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      dian:
        condition: service_healthy
      dian-java:
        condition: service_started
    restart: unless-stopped
    networks:
      - dian-network

  dian-java:
    build:
      context: ../dian-java
      dockerfile: Dockerfile
    container_name: dian-java
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: deepseek
      DEEPSEEK_API_KEY: ${ANTHROPIC_API_KEY:?需要在后端 .env 中配置模型 Key}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: ${ANTHROPIC_MODEL:-deepseek-v4-pro}
      LLM_FALLBACK_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dian123}
      CHROMA_HOST: http://chromadb
      CHROMA_PORT: "8000"
      DIAN_DATA_DIR: /app/data/java
      KNOWLEDGE_STORE_PATH: /app/data/java/knowledge-store.json
      MEMORY_STORE_PATH: /app/data/java/memory-store.json
      DIAN_SKILLS_DIR: /app/skills
    volumes:
      - dian-java-data:/app/data
      - ../dian-java/skills:/app/skills:ro
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dian-network

  nginx:
    volumes:
      - ./config/nginx/web-gateway.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started

volumes:
  dian-java-data:
    external: true
    name: ${DIAN_JAVA_DATA_VOLUME:-dianjava_app-data}
