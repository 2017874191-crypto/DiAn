[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dian-backend"
version = "0.1.0"
description = "DiAn logistics exception case coordination backend"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "api*", "core*", "evaluation*", "memory*", "monitor*", "tooling*", "config*", "skills*"]
exclude = ["tests*", "wiki*", "data*", "logs*"]
namespaces = true

[tool.setuptools.package-data]
config = ["*.json", "*.yml", "logistics/*.json", "nginx/*.conf"]
skills = ["*/SKILL.md"]
evaluation = ["datasets/**/*.json", "datasets/**/*.jsonl", "datasets/**/*.md", "datasets/**/*.txt"]
