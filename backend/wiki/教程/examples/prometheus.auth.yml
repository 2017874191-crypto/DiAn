global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: dian
    environment: production

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: dian-app
    static_configs:
      - targets: ["dian:8000"]
        labels:
          service: dian
    scrape_interval: 10s
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/dian_metrics_token

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
